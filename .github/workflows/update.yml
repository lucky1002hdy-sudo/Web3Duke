name: Auto Update Subscriptions

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Prevent multiple aggregation jobs from running at the same time
concurrency:
  group: aggregate-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: Execute node aggregator
        run: |
          python aggregator.py

      - name: Commit and push changes if updated
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add output/sub.yaml output/attribution.json

          if git diff --cached --quiet; then
            echo "No changes in generated files. Skipping commit."
            exit 0
          fi

          git commit -m "chore(auto): update aggregated subscriptions [skip ci]"

          for i in 1 2 3; do
            echo "Push attempt $i..."

            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Push succeeded."
                exit 0
              fi
            else
              echo "Rebase failed."
              git rebase --abort || true
            fi

            echo "Push failed. Retrying in 5 seconds..."
            sleep 5
          done

          echo "Failed to push after 3 attempts."
          exit 1